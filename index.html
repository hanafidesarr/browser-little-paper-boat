<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Little Paper Boat — Cozy 3D Browser Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Yomogi&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/ui/styles.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #7ca88c;
      font-family: 'Quicksand', -apple-system, sans-serif;
      touch-action: none;
    }
    #application-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
    }
    #ui-container {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="application-canvas"></canvas>
  <div id="ui-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
