<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Little Paper Boat — Phase 1 Procedural River Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #7ca88c;
      font-family: 'Quicksand', -apple-system, sans-serif;
      touch-action: none;
    }
    #application-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
    }
    #debug-ui-overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 24px;
    }
    .hud-panel {
      pointer-events: auto;
      background: rgba(253, 251, 247, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(25, 45, 30, 0.15);
      padding: 16px 20px;
      color: #244234;
      max-width: 440px;
    }
    .hud-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e5233;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-subtitle {
      font-size: 0.85rem;
      color: #557762;
      margin-bottom: 12px;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 14px;
      font-size: 0.88rem;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.04);
      padding: 8px 12px;
      border-radius: 8px;
    }
    .metric-label {
      color: #5d7568;
    }
    .metric-val {
      font-weight: 600;
      color: #1a4d2e;
      text-align: right;
    }
    .section-badge {
      display: inline-block;
      background: #e8f5ec;
      border: 1px solid #99cda8;
      color: #1c5e34;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .proto-btn {
      background: #2d7a46;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(45, 122, 70, 0.3);
      transition: all 0.15s ease;
    }
    .proto-btn:hover {
      background: #24653a;
      transform: translateY(-1px);
    }
    .proto-btn.secondary {
      background: #ffffff;
      color: #244234;
      border: 1.5px solid #a3ccb1;
    }
    .proto-btn.secondary:hover {
      background: #eef6f1;
    }
    .legend-box {
      font-size: 0.8rem;
      color: #3b5c49;
      line-height: 1.5;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      margin-right: 12px;
    }
    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 5px;
      display: inline-block;
    }
    @media (max-width: 600px) {
      .hud-panel { max-width: 100%; padding: 12px 14px; }
      .metrics-grid { font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <canvas id="application-canvas"></canvas>
  <div id="debug-ui-overlay">
    <!-- Top Left: River Metrics & Controls -->
    <div class="hud-panel">
      <div class="hud-title">
        <span>⛵</span> Little Paper Boat
      </div>
      <div class="hud-subtitle">Phase 1 — Procedural River Prototype</div>
      <div id="section-indicator" class="section-badge">Section 1: Straight Flow</div>
      
      <div class="metrics-grid">
        <span class="metric-label">Distance:</span>
        <span id="metric-distance" class="metric-val">0.0 m</span>
        <span class="metric-label">Progress:</span>
        <span id="metric-progress" class="metric-val">0.0%</span>
        <span class="metric-label">River Width:</span>
        <span id="metric-width" class="metric-val">8.0 m</span>
        <span class="metric-label">Curvature:</span>
        <span id="metric-curvature" class="metric-val">0.00 rad/m</span>
        <span class="metric-label">Total Length:</span>
        <span id="metric-total" class="metric-val">0.0 m</span>
        <span class="metric-label">Probe Speed:</span>
        <span id="metric-speed" class="metric-val">5.0 m/s</span>
      </div>

      <div class="btn-row">
        <button id="btn-toggle-debug" class="proto-btn">Toggle Debug Vectors (D)</button>
        <button id="btn-toggle-pause" class="proto-btn secondary">Pause Probe</button>
        <button id="btn-restart-probe" class="proto-btn secondary">Restart</button>
      </div>
    </div>

    <!-- Bottom Left: Visualizer Legend -->
    <div class="hud-panel legend-box" style="margin-top: auto; max-width: 480px;">
      <div style="font-weight: 700; margin-bottom: 4px; color: #1e5233;">Debug Visualization Legend:</div>
      <div>
        <span class="legend-item"><span class="legend-color" style="background: #33f233;"></span>Tangent Vector</span>
        <span class="legend-item"><span class="legend-color" style="background: #f24040;"></span>Normal Vector</span>
        <span class="legend-item"><span class="legend-color" style="background: #19ccff;"></span>River Boundaries</span>
        <span class="legend-item"><span class="legend-color" style="background: #ffd533;"></span>Width Bars & Control Points</span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
