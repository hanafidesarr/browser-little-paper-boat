<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7ac2cd">
  <meta name="description" content="A little boat. A wonderful journey. Cozy 3D river navigation adventure.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Little Paper Boat">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Little Paper Boat — Cozy 3D Browser Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Yomogi&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/ui/styles.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background: #7ca88c;
      font-family: 'Quicksand', -apple-system, sans-serif;
      touch-action: none;
      -webkit-touch-callout: none;
    }
    #application-canvas {
      width: 100vw;
      height: 100%;
      height: 100dvh;
      display: block;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 1;
      touch-action: none;
    }
    #ui-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      z-index: 10;
      pointer-events: none;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="application-canvas"></canvas>
  <div id="ui-container"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
