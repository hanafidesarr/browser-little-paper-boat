<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a7b8e"/>
      <stop offset="50%" stop-color="#3fa8b8"/>
      <stop offset="100%" stop-color="#205f6e"/>
    </linearGradient>
    <linearGradient id="waterRipple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </linearGradient>
    <linearGradient id="boatHull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ebe7de"/>
    </linearGradient>
    <linearGradient id="boatShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e2d5"/>
      <stop offset="100%" stop-color="#d4ccbe"/>
    </linearGradient>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="rgba(10,35,45,0.35)"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Water ripple rings -->
  <ellipse cx="256" cy="380" rx="190" ry="38" fill="none" stroke="url(#waterRipple)" stroke-width="8"/>
  <ellipse cx="256" cy="405" rx="140" ry="26" fill="none" stroke="url(#waterRipple)" stroke-width="6"/>

  <!-- Paper Boat -->
  <g filter="url(#shadow)">
    <!-- Main central fold & sail -->
    <polygon points="256,110 330,300 256,285" fill="url(#boatHull)"/>
    <polygon points="256,110 182,300 256,285" fill="url(#boatShade)"/>

    <!-- Left hull wing -->
    <polygon points="120,300 256,285 220,350 145,350" fill="url(#boatShade)"/>
    
    <!-- Right hull wing -->
    <polygon points="392,300 256,285 292,350 367,350" fill="url(#boatHull)"/>

    <!-- Center boat body -->
    <polygon points="220,350 256,285 292,350 256,365" fill="#fcfbf9"/>

    <!-- Gentle flag pennant at peak -->
    <polygon points="256,110 256,80 290,95" fill="url(#flagGrad)"/>
  </g>

  <!-- Little golden journey star -->
  <polygon points="380,130 388,148 408,149 392,162 397,181 380,170 363,181 368,162 352,149 372,148" fill="#fbbf24"/>
</svg>
